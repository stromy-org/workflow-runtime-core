# Self-contained on purpose — do NOT convert this back to a call into
# `stromy-org/stromy-org/.github/workflows/ci-python.yml`.
#
# Every other Python satellite calls that shared reusable workflow, and this repo
# did too until it went public (ORG-PLAN-155 locked decision 3). The control
# plane that hosts the shared workflow is PRIVATE and this repo is PUBLIC, so the
# call stopped resolving the moment visibility flipped: the initial run went
# green while the repo was still private, and every run after the flip failed at
# 0s with a startup error and no jobs at all.
#
# Inlining is the right shape regardless of the mechanics: a public library must
# be buildable from its own contents by anyone who clones it. Proving a public
# package correct via a private workflow is a dependency its own consumers cannot
# satisfy.
#
# The cost is real and accepted: this file must be kept in step with
# ci-python.yml by hand. Keep it minimal so that stays cheap — this repo has no
# private git+URL dependencies and no `readiness.py`, so the App-token minting and
# control-plane fetching the shared workflow spends two jobs on have nothing to do
# here anyway.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run pyright src/workflow_runtime_core/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - run: uv python install 3.12
      - run: uv sync --all-extras

      - name: Unit tests
        run: uv run pytest tests/unit -v

      - name: Contract tests
        # The optional-extra boundary (a base install pulls neither LangGraph nor
        # aio-pika) is asserted here. That is the package's headline guarantee to
        # the public facade, so a vacuous pass would be worse than useless —
        # unlike the shared workflow, this does NOT tolerate exit 5.
        run: uv run pytest -m contract -v

      - name: Integration tests (real PostgreSQL)
        # Not optional. The one bug this package has actually shipped was a probe
        # that aborted its caller's transaction on a FRESH database — invisible to
        # every mock, reproducible only against a real engine, and fatal on the
        # first boot of every new deployment. Testcontainers uses the runner's
        # Docker daemon; ubuntu-latest ships one.
        run: uv run pytest tests/integration -v

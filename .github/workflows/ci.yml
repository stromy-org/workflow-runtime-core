# Public library: native checks must remain resolvable without private workflows.
# One Linux context retains every original unit, API and real-engine assertion.
# The service recipe is a finite, repository-owned template deviation.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      STROMY_PG_DSN: postgresql://wrc:wrc@127.0.0.1:5432/wrc
      STROMY_AMQP_URL: amqp://guest:guest@127.0.0.1:5672/
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wrc
          POSTGRES_PASSWORD: wrc
          POSTGRES_DB: wrc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wrc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.26'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.11
      - name: Install
        timeout-minutes: 10
        run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check
      - name: Type check
        run: uv run pyright src/workflow_runtime_core/
      - name: Unit tests
        run: |
          rm -f .unit-junit.xml
          uv run pytest tests/unit -v --junitxml=.unit-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step tests --suite unit --report .unit-junit.xml --returncode 0
      - name: Contract tests
        run: |
          rm -f .contract-junit.xml
          uv run pytest -m contract -v --junitxml=.contract-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step contract --suite contract --report .contract-junit.xml --returncode 0
      - name: Integration tests (real PostgreSQL + RabbitMQ)
        # Required: the durable guarantees and fresh-database regression need
        # real engines. Missing, skipped or reduced execution fails the floor.
        run: |
          rm -f .pytest_cache/durable-junit.xml
          uv run pytest tests/integration -v -ra --junitxml=.pytest_cache/durable-junit.xml
          uv run --no-project --python 3.12 --with pyyaml --with jsonschema python scripts/ci/suite_execution.py --step tests --suite durable --report .pytest_cache/durable-junit.xml --returncode 0
      - run: uv lock --check
      - run: uv build

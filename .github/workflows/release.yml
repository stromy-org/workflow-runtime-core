# Build a sdist+wheel on tag push and attach them to a GitHub Release.
#
# Workflow:
#   1. Bump version in pyproject.toml on main.
#   2. git tag vX.Y.Z && git push --tags
#   3. This workflow builds + publishes the release.
#
# Consumers depend on a specific tag via:
#   "<pkg> @ git+https://github.com/stromy-org/workflow-runtime-core.git@vX.Y.Z"
# so the GitHub Release artifacts are informational — uv reads the source tree
# at the tagged commit directly. The release page is the human-facing audit
# trail and changelog anchor.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      # The `secrets` context is NOT available in a step-level `if:` — using it
      # there is a workflow COMPILE error, which GitHub reports as a 0s run with
      # no jobs and no logs rather than as a lint failure. Job-level `env` is one
      # of the few places `secrets` *is* allowed, so hop through it and let the
      # steps below test a plain string.
      HAS_CI_APP: ${{ secrets.CI_APP_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Build distributions
        run: uv build
      - name: Verify tag matches pyproject version
        run: |
          PYPROJECT_VERSION="$(uv run python -c 'import tomllib,sys; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${PYPROJECT_VERSION}"
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*

      # ---------------------------------------------------------------------
      # Consumer auto-bump — DISABLED-BY-ABSENCE on this repo, deliberately.
      #
      # The steps below need the org `stromy-ci` App credential. That org secret
      # is `visibility: selected`, and every one of the ~46 repositories on its
      # allowlist is PRIVATE. This repository is PUBLIC (ORG-PLAN-155 locked
      # decision 3, so the public workflow facade can install an exact tag with
      # no build credential), so allowlisting it would put a broad org-wide
      # Contents:write credential into a public repo's workflow surface for the
      # first time. That is a security-posture decision for the operator, not a
      # provisioning detail for a release job — so the credential is absent and
      # these steps SKIP rather than fail.
      #
      # Nothing is lost: ORG-PLAN-155 locked decision 4 pins consumers to exact
      # immutable tags committed by hand, so an auto-bump PR would be rewriting
      # a pin this design deliberately sets. Bump consumers with an explicit
      # edit to `[tool.uv.sources]` + `uv lock`.
      #
      # To re-enable: add this repo to the CI_APP_ID / CI_APP_PRIVATE_KEY
      # allowlists and the steps light up on the next tag, unchanged.
      # ---------------------------------------------------------------------
      - name: Mint GitHub App token
        # An App token (unlike the default GITHUB_TOKEN) can trigger the
        # downstream bump workflow. See infra-docs/ai/cross-repo-pats.md.
        if: env.HAS_CI_APP == 'true'
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Notify Stromy,stromy-workflows-mcp to auto-bump the pin
        # Fires a repository_dispatch event into the listed consumer repo(s).
        # The bump-internal-lib.yml workflow there opens a PR rewriting the
        # tag in [tool.uv.sources] and regenerating uv.lock.
        if: env.HAS_CI_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO_SLUG: ${{ github.event.repository.name }}
        run: |
          gh api repos/stromy-org/Stromy/dispatches \
            -f event_type=internal-lib-released \
            -F "client_payload[repo]=${REPO_SLUG}" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"
          gh api repos/stromy-org/stromy-workflows-mcp/dispatches \
            -f event_type=internal-lib-released \
            -F "client_payload[repo]=${REPO_SLUG}" \
            -F "client_payload[tag]=${GITHUB_REF_NAME}"

name: dependabot-auto-merge

# GENERATED by stromy-org/scripts/dependabot_automerge.py — do not edit here.
# The auto-merge logic lives ONCE, in stromy-org's reusable workflow below, so a
# fix there reaches this repo on its next Dependabot PR. `secrets: inherit`
# forwards the org's DEPENDABOT secret store (a dependabot[bot] run reads no
# other), which is where the stromy-ci App credentials must be for the merge to
# trigger this repo's workflows (deploys included).

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ github.actor == 'dependabot[bot]' }}
    uses: stromy-org/stromy-org/.github/workflows/dependabot-auto-merge.yml@main
    secrets: inherit
